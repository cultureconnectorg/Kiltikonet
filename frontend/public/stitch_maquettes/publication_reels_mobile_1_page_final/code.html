<style>
        body {
            background-color: #131314;
            color: #e5e2e3;
            font-family: 'Manrope', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .glass-panel {
            background: rgba(32, 31, 32, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .oled-border {
            box-shadow: inset 0 0 0 1px rgba(232, 213, 160, 0.1), 0 0 20px rgba(0,0,0,0.8);
        }
        .gold-glow {
            box-shadow: 0 10px 30px -10px rgba(232, 213, 160, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 w-full bg-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#e8d5a0] hover:scale-105 transition-transform cursor-pointer">close</span>
</div>
<h1 class="text-xl font-bold tracking-tight text-[#e8d5a0] font-serif italic tracking-tighter">Digital Curator</h1>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#e8d5a0] hover:scale-105 transition-transform cursor-pointer">more_vert</span>
</div>
</header>
<!-- Main Content Canvas (No Scroll) -->
<main class="flex-1 relative mt-16 mb-24 px-4 flex flex-col items-center justify-center">
<!-- Video Preview Container -->
<div class="relative w-full max-w-sm aspect-[9/16] rounded-sm overflow-hidden oled-border bg-surface-container-lowest flex items-center justify-center">
<img class="absolute inset-0 w-full h-full object-cover opacity-80" data-alt="cinematic close-up of flowing dark silk with golden light reflections, mysterious atmosphere, high-end editorial aesthetic, deep shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHIYmItdRjhCp8zp9XOHOY0YHaxWaoRNWKP5qUJz5vXw716cWAwF3RJiAUNk8T4idBdmzRDS4r5WleOiXOk0nTiOf72MvGR6WJ98nqiM5vAWoEO8mSPoB29vjfwABHMoAxcBY3JGA1c19NyQYsJpcdkNRcZmwzH4MhbP4sSZIRvg6CeX4btYYEfOfiIkbG05zjuvXdtee-C2GBmyJyY6H3IUnceQOK4-xulUiOd2l9ljhVFUVW7Xxhi1-0Ch0oM93qCWsK6rYD1ng"/>
<!-- Floating Tool Panel (Left) -->
<div class="absolute left-4 top-1/2 -translate-y-1/2 flex flex-col gap-6 z-20">
<button class="flex flex-col items-center gap-1 group">
<div class="p-3 glass-panel rounded-full text-primary-container hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined">bolt</span>
</div>
<span class="text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-label">Énergie</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="p-3 glass-panel rounded-full text-primary-container hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined">music_note</span>
</div>
<span class="text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-label">Rythme</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="p-3 glass-panel rounded-full text-primary-container hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined">auto_awesome</span>
</div>
<span class="text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-label">Poésie</span>
</button>
</div>
<!-- OLED Play Overlay (Center) -->
<div class="z-10 bg-primary-container/10 p-6 rounded-full border border-primary-container/20 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary-container text-4xl fill">play_arrow</span>
</div>
<!-- Caption Area (Bottom Internal) -->
<div class="absolute bottom-4 left-4 right-4 z-20">
<div class="glass-panel p-4 rounded-sm border border-outline-variant/10">
<p class="text-[10px] text-primary uppercase tracking-widest mb-1 font-label">Légende</p>
<textarea class="w-full bg-transparent border-none p-0 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-0 text-sm font-body resize-none" placeholder="Rédigez l'histoire de ce fragment..." rows="2"></textarea>
</div>
</div>
</div>
<!-- Call to Action -->
<div class="mt-8 w-full max-w-sm px-2">
<button class="w-full bg-primary-container text-on-primary py-4 rounded-sm flex items-center justify-center gap-3 active:scale-[0.97] transition-all duration-300 gold-glow">
<span class="font-label font-bold uppercase tracking-[0.15em] text-sm">Publier sur le Feed Immersif</span>
<span class="material-symbols-outlined fill text-xl">check_circle</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#201f20]/70 backdrop-blur-3xl shadow-[0_-20px_40px_rgba(0,0,0,0.4)] rounded-t-sm">
<div class="flex flex-col items-center justify-center text-[#e5e2e3]/40 hover:text-[#e8d5a0] transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-hover:scale-105 transition-transform">movie_edit</span>
<span class="font-sans text-[10px] uppercase tracking-widest">Studio</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e5e2e3]/40 hover:text-[#e8d5a0] transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-hover:scale-105 transition-transform">bolt</span>
<span class="font-sans text-[10px] uppercase tracking-widest">Énergie</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e5e2e3]/40 hover:text-[#e8d5a0] transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-hover:scale-105 transition-transform">music_note</span>
<span class="font-sans text-[10px] uppercase tracking-widest">Rythme</span>
</div>
<div class="flex flex-col items-center justify-center text-[#e5e2e3]/40 hover:text-[#e8d5a0] transition-colors cursor-pointer group">
<span class="material-symbols-outlined mb-1 group-hover:scale-105 transition-transform">auto_awesome</span>
<span class="font-sans text-[10px] uppercase tracking-widest">Poésie</span>
</div>
<div class="flex flex-col items-center justify-center bg-[#e8d5a0] text-[#3a2f09] rounded-sm px-3 py-1 active:scale-0.95 transition-all duration-450 cursor-pointer">
<span class="material-symbols-outlined fill">check_circle</span>
<span class="font-sans text-[10px] uppercase tracking-widest font-bold">Publier</span>
</div>
</nav>
</body></html>
